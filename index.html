<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Daily Riddle</title>
<meta name="theme-color" content="#14161c">
<meta name="description" content="A new math and logic riddle every day.">
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" href="icon-192.png">
<link rel="apple-touch-icon" href="icon-180.png">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="Riddle">
<style>
  :root {
    --bg: #14161c;
    --card: #1d2029;
    --line: #2c303c;
    --text: #ecebe6;
    --muted: #9a9cab;
    --accent: #f2b84b;
    --good: #6fcf97;
  }
  * { box-sizing: border-box; }
  html, body { margin: 0; background: var(--bg); color: var(--text); }
  body {
    font: 17px/1.55 -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
    padding: env(safe-area-inset-top) env(safe-area-inset-right) env(safe-area-inset-bottom) env(safe-area-inset-left);
    -webkit-tap-highlight-color: transparent;
  }
  .wrap { max-width: 640px; margin: 0 auto; padding: 16px 18px 48px; }
  header { display: flex; align-items: center; justify-content: space-between; gap: 12px; padding: 8px 0 18px; }
  .brand { font-family: Georgia, "Times New Roman", serif; font-size: 22px; letter-spacing: .2px; }
  .brand span { color: var(--accent); }
  .lang { display: flex; border: 1px solid var(--line); border-radius: 999px; overflow: hidden; }
  .lang button { background: none; border: 0; color: var(--muted); font: 600 13px/1 inherit; font-family: inherit; padding: 8px 12px; cursor: pointer; }
  .lang button.on { background: var(--accent); color: #1a1405; }
  nav { display: flex; gap: 6px; margin-bottom: 18px; }
  nav a { flex: 1; text-align: center; text-decoration: none; color: var(--muted); padding: 10px; border-radius: 10px; border: 1px solid var(--line); font-weight: 600; font-size: 15px; }
  nav a.on { color: var(--text); background: var(--card); border-color: #3a3f4e; }
  .card { background: var(--card); border: 1px solid var(--line); border-radius: 16px; padding: 22px 20px; }
  .meta { display: flex; flex-wrap: wrap; align-items: center; gap: 8px 12px; color: var(--muted); font-size: 14px; margin-bottom: 10px; }
  .dots { letter-spacing: 2px; color: var(--accent); }
  .solvedtag { color: var(--good); font-weight: 600; }
  h1 { font-family: Georgia, "Times New Roman", serif; font-weight: normal; font-size: 28px; line-height: 1.2; margin: 0 0 14px; }
  .q { white-space: pre-line; }
  .actions { display: flex; flex-wrap: wrap; gap: 8px; margin-top: 22px; }
  .btn { appearance: none; border: 1px solid var(--line); background: #252935; color: var(--text); font: 600 15px/1 inherit; font-family: inherit; padding: 12px 16px; border-radius: 10px; cursor: pointer; }
  .btn.primary { background: var(--accent); border-color: var(--accent); color: #1a1405; }
  .btn.good { background: transparent; border-color: var(--good); color: var(--good); }
  .panel { margin-top: 18px; padding: 16px; border-radius: 12px; white-space: pre-line; }
  .panel b { display: block; font-size: 13px; text-transform: uppercase; letter-spacing: .8px; margin-bottom: 6px; }
  .hint { background: #23262f; border-left: 3px solid var(--muted); }
  .answer { background: #2a2618; border-left: 3px solid var(--accent); }
  .answer b { color: var(--accent); }
  .stats { color: var(--muted); font-size: 14px; text-align: center; margin-top: 18px; }
  .list { list-style: none; margin: 0; padding: 0; }
  .list li a { display: flex; align-items: center; gap: 12px; text-decoration: none; color: var(--text); padding: 14px 4px; border-bottom: 1px solid var(--line); }
  .list .n { color: var(--muted); font-size: 13px; min-width: 76px; }
  .list .t { flex: 1; }
  .list .s { color: var(--good); }
  .back { display: inline-block; color: var(--muted); text-decoration: none; margin-bottom: 12px; font-size: 15px; }
  .empty { color: var(--muted); text-align: center; padding: 30px 0; }
  .install { margin-top: 26px; color: var(--muted); font-size: 13px; text-align: center; }
</style>
</head>
<body>
<div class="wrap">
  <header>
    <div class="brand">Daily <span>Riddle</span></div>
    <div class="lang" role="group" aria-label="Language">
      <button data-lang="en">EN</button>
      <button data-lang="pt">PT</button>
    </div>
  </header>
  <nav>
    <a href="#today" id="nav-today"></a>
    <a href="#archive" id="nav-archive"></a>
  </nav>
  <main id="view"></main>
  <p class="install" id="install"></p>
</div>
<script src="riddles.js"></script>
<script src="app.js"></script>
</body>
</html>
