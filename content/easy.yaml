    a: |
      100. 9 + 180 = 189 algarismos até à página 99, e os 3 que faltam são a página 100.

- answer: [194]
  en:
    title: Mystery number
    q: |
      I'm a three-digit number. My tens digit is 5 more than my units digit, and my hundreds digit is 8 less than my tens digit.

      What number am I?
    hint: The hundreds digit can't be 0, so the tens digit must be big.
    a: |
      194. Tens − 8 ≥ 1 forces tens = 9, so hundreds = 1 and units = 4.
  pt:
    title: Número mistério
    q: |
      Sou um número de três algarismos. O algarismo das dezenas é mais 5 do que o das unidades, e o das centenas é menos 8 do que o das dezenas.

      Que número sou?
    hint: As centenas não podem ser 0, por isso as dezenas têm de ser grandes.
    a: |
      194. Dezenas − 8 ≥ 1 obriga a dezenas = 9, logo centenas = 1 e unidades = 4.

