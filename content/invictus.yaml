- answer: [505]
  en:
    title: Zeros of 2026!
    q: |
      How many zeros are at the end of 2026! (2026 × 2025 × … × 2 × 1)?
    hint: Count factors of 5, including the extra ones in multiples of 25, 125 and 625.
    a: |
      505 = ⌊2026/5⌋ + ⌊2026/25⌋ + ⌊2026/125⌋ + ⌊2026/625⌋ = 405 + 81 + 16 + 3.
  pt:
    title: Zeros de 2026!
    q: |
      Com quantos zeros acaba 2026! (2026 × 2025 × … × 2 × 1)?
    hint: Conta os fatores 5, incluindo os extra dos múltiplos de 25, 125 e 625.
    a: |
      505 = ⌊2026/5⌋ + ⌊2026/25⌋ + ⌊2026/125⌋ + ⌊2026/625⌋ = 405 + 81 + 16 + 3.

- answer: [14.7]
  tol: 0.01
  en:
    title: Every face
    q: |
      You roll a die until every face from 1 to 6 has appeared at least once.

      On average, how many rolls does it take? (Give a decimal.)
    hint: Once you've seen k faces, a new one appears with probability (6 − k)/6.
    a: |
      14.7 = 6/6 + 6/5 + 6/4 + 6/3 + 6/2 + 6/1.
  pt:
    title: Todas as faces
    q: |
      Lanças um dado até terem saído todas as faces de 1 a 6 pelo menos uma vez.

      Em média, quantos lançamentos são precisos? (Dá um decimal.)
    hint: Depois de veres k faces, sai uma nova com probabilidade (6 − k)/6.
    a: |
      14,7 = 6/6 + 6/5 + 6/4 + 6/3 + 6/2 + 6/1.

- answer: [52]
  en:
    title: Sum and product
    q: |
      Two whole numbers x and y satisfy 1 < x < y and x + y ≤ 100. Sam knows only their sum; Pam knows only their product.

      Sam: "I'm sure you don't know the numbers."
      Pam: "Now I know them."
      Sam: "Now I know them too."

      What is their product?
    hint: First find all sums that can't be written as two primes (Sam's statement). Then filter step by step. A computer helps, but it can be done by hand.
    a: |
      52 (the numbers are 4 and 13). Sam's sum must be one where no split gives a product Pam could factor uniquely: 11, 17, 23, 27, 29, 35, 37, 41, 47, 53. Among products from those sums, only some are unique; and of those, only the sum 17 leaves exactly one option: 4 × 13 = 52.
  pt:
    title: Soma e produto
    q: |
      Dois números inteiros x e y com 1 < x < y e x + y ≤ 100. O Sam só sabe a soma; a Pam só sabe o produto.

      Sam: "Tenho a certeza de que não sabes os números."
      Pam: "Agora sei."
      Sam: "Agora também sei."

      Qual é o produto?
    hint: Encontra primeiro as somas que não se escrevem como soma de dois primos (a frase do Sam). Depois filtra passo a passo. Um computador ajuda, mas faz-se à mão.
    a: |
      52 (os números são 4 e 13). A soma do Sam tem de ser uma em que nenhuma divisão dá um produto que a Pam fatorizasse de forma única: 11, 17, 23, 27, 29, 35, 37, 41, 47, 53. Entre os produtos dessas somas só alguns são únicos; e destes, só a soma 17 deixa uma única opção: 4 × 13 = 52.

- answer: [4]
  en:
    title: Circle in a triangle
    q: |
      A triangle has sides 13, 14 and 15.

      What is the radius of the circle inscribed in it?
    hint: Area = r × s, where s is half the perimeter. Use Heron's formula for the area.
    a: |
      4. s = 21, area = √(21 · 8 · 7 · 6) = 84, r = 84 / 21 = 4.
  pt:
    title: Círculo no triângulo
    q: |
      Um triângulo tem lados 13, 14 e 15.

      Qual o raio da circunferência inscrita?
    hint: Área = r × s, com s o semiperímetro. Usa a fórmula de Heron para a área.
    a: |
      4. s = 21, área = √(21 · 8 · 7 · 6) = 84, r = 84 / 21 = 4.

- answer: [15621]
  en:
    title: Sailors and coconuts
    q: |
      Five sailors collect a pile of coconuts. During the night each sailor in turn wakes up, splits the pile into 5 equal parts with 1 left over (given to a monkey), hides his fifth and puts the rest back. In the morning they split what's left into 5 equal parts, again with 1 left over for the monkey.

      What is the smallest possible number of coconuts at the start?
    hint: Try adding 4 coconuts to the pile: then every split works without remainders.
    a: |
      15621. With N + 4 coconuts every step is an exact division by 5 followed by keeping 4/5, six times in all, so N + 4 must be a multiple of 5⁶ = 15625.
  pt:
    title: Marinheiros e cocos
    q: |
      Cinco marinheiros juntam um monte de cocos. Durante a noite, cada um acorda à vez, divide o monte em 5 partes iguais e sobra 1 (que dá a um macaco), esconde a sua parte e volta a juntar o resto. De manhã dividem o que resta em 5 partes iguais, e volta a sobrar 1 para o macaco.

      Qual o menor número possível de cocos no início?
    hint: Experimenta somar 4 cocos ao monte: assim todas as divisões são exatas.
    a: |
      15621. Com N + 4 cocos cada passo é uma divisão exata por 5 seguida de ficar com 4/5, seis vezes ao todo, por isso N + 4 tem de ser múltiplo de 5⁶ = 15625.

- answer: [265]
  en:
    title: Wrong envelopes
    q: |
      6 letters are put into 6 addressed envelopes at random.

      In how many ways can every single letter end up in the wrong envelope?
    hint: Derangements: D(n) = (n − 1)(D(n − 1) + D(n − 2)), with D(1) = 0, D(2) = 1.
    a: |
      265. D(3) = 2, D(4) = 9, D(5) = 44, D(6) = 5 × (44 + 9) = 265.
  pt:
    title: Envelopes trocados
    q: |
      6 cartas são postas ao acaso em 6 envelopes endereçados.

      De quantas maneiras podem ficar todas as cartas no envelope errado?
    hint: Desarranjos: D(n) = (n − 1)(D(n − 1) + D(n − 2)), com D(1) = 0, D(2) = 1.
    a: |
      265. D(3) = 2, D(4) = 9, D(5) = 44, D(6) = 5 × (44 + 9) = 265.

- answer: [49]
