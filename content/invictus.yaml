- answer: [11.59]
  tol: 0.02
  en:
    title: The grazing goat
    q: |
      A circular field has a radius of 10 m. A goat is tied to a post on the fence at the edge of the field.

      How long must the rope be, in metres, so the goat can graze exactly half the field? (Two decimals.)
    hint: The grazed area is the overlap of two circles. You'll need to solve the equation numerically.
    a: |
      About 11.59 m. With field radius 1 and rope R, the overlap is R²·arccos(R/2) + arccos(1 − R²/2) − (R/2)·√(4 − R²). Setting it to π/2 gives R ≈ 1.1587.
  pt:
    title: A cabra a pastar
    q: |
      Um campo circular tem 10 m de raio. Uma cabra está presa a um poste na vedação, na borda do campo.

      Que comprimento deve ter a corda, em metros, para a cabra pastar exatamente metade do campo? (Duas casas decimais.)
    hint: A área pastada é a interseção de dois círculos. Tens de resolver a equação numericamente.
    a: |
      Cerca de 11,59 m. Com raio do campo 1 e corda R, a interseção é R²·arccos(R/2) + arccos(1 − R²/2) − (R/2)·√(4 − R²). Igualando a π/2 obtém-se R ≈ 1,1587.

- answer: [4562]
  en:
    title: Change for a euro
    q: |
      In how many different ways can you make €1 using 1, 2, 5, 10, 20 and 50 cent coins? (Order doesn't matter.)
    hint: Build a table: ways to make each amount using only the first k coin types.
    a: |
      4562, using dynamic programming: for each coin c, ways[n] += ways[n − c].
  pt:
    title: Trocos de um euro
    q: |
      De quantas maneiras diferentes fazes 1 € com moedas de 1, 2, 5, 10, 20 e 50 cêntimos? (A ordem não importa.)
    hint: Faz uma tabela: maneiras de fazer cada valor usando só os primeiros k tipos de moeda.
    a: |
      4562, por programação dinâmica: para cada moeda c, maneiras[n] += maneiras[n − c].

