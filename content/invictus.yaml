    hint: Se os topos estão às alturas h₁ e h₂, o cruzamento fica à altura h₁h₂ / (h₁ + h₂).
    a: |
      ≈ 12,31 m. Com largura w: h₁ = √(900 − w²), h₂ = √(400 − w²) e h₁h₂/(h₁ + h₂) = 10. Resolvendo numericamente, w ≈ 12,31.

