    hint: If the tops are at heights h₁ and h₂, the crossing height is h₁h₂ / (h₁ + h₂).
    a: |
      ≈ 12.31 m. With width w: h₁ = √(900 − w²), h₂ = √(400 − w²), and h₁h₂/(h₁ + h₂) = 10. Solving numerically gives w ≈ 12.31.
  pt:
