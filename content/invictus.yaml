- answer: [0.6366, 0.637]
  tol: 0.002
  en:
    title: Buffon's needle
    q: |
      A floor has parallel lines 1 unit apart. You drop a needle of length 1 at random.

      What is the probability it crosses a line? (Four decimals.)
    hint: The answer involves π.
    a: |
      2/π ≈ 0.6366. Integrate over the needle's angle θ: at angle θ the needle crosses with probability sin θ, and the average of sin θ over [0, π/2] is 2/π.
  pt:
    title: A agulha de Buffon
    q: |
      Um chão tem linhas paralelas a 1 unidade de distância. Deixas cair ao acaso uma agulha de comprimento 1.

      Qual a probabilidade de cruzar uma linha? (Quatro casas decimais.)
    hint: A resposta envolve π.
    a: |
      2/π ≈ 0,6366. Integrando sobre o ângulo θ da agulha: a probabilidade de cruzar com ângulo θ é sen θ, e a média de sen θ em [0, π/2] dá 2/π.

